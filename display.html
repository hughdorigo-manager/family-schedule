<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Schedule</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF8F3;
    --warm-white: #FFFFFF;
    --navy: #1B2A4A;
    --navy-light: #2E4270;
    --steel: #4A5568;
    --muted: #718096;
    --border: #E2DDD5;
    --health: #2D6A4F;
    --health-bg: #D8F3DC;
    --family: #7B2D8B;
    --family-bg: #EDE0F5;
    --reminder: #B45309;
    --reminder-bg: #FEF3C7;
    --routine: #1E5F8C;
    --routine-bg: #DBEAFE;
    --today-border: #2E4270;
    --today-bg: #EEF2FF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--cream);
    font-family: 'Source Sans 3', sans-serif;
    color: var(--navy);
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 0;
  }

  /* TOP CLOCK BAR */
  .clock-bar {
    background: var(--navy);
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .clock-time {
    font-family: 'Lora', serif;
    font-size: 52px;
    font-weight: 500;
    letter-spacing: -1px;
    line-height: 1;
  }
  .clock-date {
    font-size: 22px;
    font-weight: 400;
    opacity: 0.85;
    text-align: right;
    line-height: 1.4;
  }
  .clock-date .day-name {
    font-size: 28px;
    font-weight: 600;
    opacity: 1;
    display: block;
  }
  .wifi-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    opacity: 0.7;
    margin-top: 4px;
  }
  .wifi-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #68D391;
    animation: blink 3s infinite;
  }
  .wifi-dot.offline { background: #FC8181; animation: none; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* VIEW TOGGLE */
  .view-bar {
    background: var(--warm-white);
    border-bottom: 1.5px solid var(--border);
    padding: 12px 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .view-label {
    font-size: 15px;
    color: var(--muted);
    margin-right: 4px;
    font-weight: 500;
  }
  .view-btn {
    padding: 10px 28px;
    font-size: 18px;
    font-weight: 600;
    font-family: 'Source Sans 3', sans-serif;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--steel);
    cursor: pointer;
    transition: all 0.18s;
    min-width: 110px;
  }
  .view-btn:hover { border-color: var(--navy-light); color: var(--navy-light); background: #F0F4FF; }
  .view-btn.active {
    background: var(--navy);
    color: white;
    border-color: var(--navy);
  }

  /* CALENDAR AREA */
  .cal-area {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 20px;
  }

  /* DAY HEADERS */
  .dow-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 6px;
  }
  .dow-hdr {
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 0;
  }

  /* WEEK VIEW */
  .week-row {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-bottom: 6px;
  }
  .week-cell {
    background: var(--warm-white);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    min-height: 130px;
  }
  .week-cell.is-today {
    border: 2.5px solid var(--today-border);
    background: var(--today-bg);
  }
  .week-cell-head {
    padding: 8px 10px 6px;
    border-bottom: 1px solid var(--border);
    background: rgba(0,0,0,0.02);
  }
  .week-cell.is-today .week-cell-head { background: var(--navy); }
  .week-cell-dow {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .week-cell.is-today .week-cell-dow { color: rgba(255,255,255,0.7); }
  .week-cell-date {
    font-family: 'Lora', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--navy);
    line-height: 1.1;
  }
  .week-cell.is-today .week-cell-date { color: white; }
  .week-cell-events { padding: 6px 7px; display: flex; flex-direction: column; gap: 4px; }
  .ev-pill {
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.3;
  }
  .ev-pill .ev-time { font-size: 10px; opacity: 0.75; display: block; font-weight: 400; }
  .ev-pill.health    { background: var(--health-bg);   color: var(--health); }
  .ev-pill.family    { background: var(--family-bg);   color: var(--family); }
  .ev-pill.reminder  { background: var(--reminder-bg); color: var(--reminder); }
  .ev-pill.routine   { background: var(--routine-bg);  color: var(--routine); }

  /* MONTH VIEW */
  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
  }
  .month-cell {
    background: var(--warm-white);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    min-height: 85px;
    padding: 6px 7px;
  }
  .month-cell.other-month { opacity: 0.3; }
  .month-cell.is-today { border: 2.5px solid var(--today-border); background: var(--today-bg); }
  .month-cell-date {
    font-size: 18px;
    font-weight: 600;
    color: var(--navy);
    font-family: 'Lora', serif;
    margin-bottom: 3px;
  }
  .month-cell.is-today .month-cell-date { color: var(--navy-light); }
  .month-ev {
    font-size: 10px;
    font-weight: 600;
    border-radius: 4px;
    padding: 2px 5px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .month-ev.health   { background: var(--health-bg);   color: var(--health); }
  .month-ev.family   { background: var(--family-bg);   color: var(--family); }
  .month-ev.reminder { background: var(--reminder-bg); color: var(--reminder); }
  .month-ev.routine  { background: var(--routine-bg);  color: var(--routine); }

  /* TODAY STRIP */
  .today-strip {
    background: var(--navy);
    color: white;
    border-radius: 12px;
    padding: 14px 20px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .today-strip-label {
    font-size: 14px;
    font-weight: 600;
    opacity: 0.6;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .today-strip-events {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .today-strip-pill {
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 15px;
    font-weight: 600;
  }
  .no-events-today { font-size: 15px; opacity: 0.6; }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-left: auto;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
  }

  /* NAVIGATION */
  .nav-strip {
    background: var(--cream);
    border-bottom: 1.5px solid var(--border);
    padding: 10px 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .nav-btn {
    padding: 10px 26px;
    font-size: 22px;
    font-weight: 600;
    font-family: 'Source Sans 3', sans-serif;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: var(--warm-white);
    color: var(--navy);
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
    min-width: 64px;
    text-align: center;
  }
  .nav-btn:hover { background: #F0F4FF; border-color: var(--navy-light); }
  .nav-btn:active { background: #E0E8FF; }
  .nav-btn.disabled { opacity: 0.3; pointer-events: none; }
  .nav-label {
    font-family: 'Lora', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--navy);
    min-width: 260px;
    text-align: center;
  }
  .nav-today-btn {
    padding: 8px 20px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Source Sans 3', sans-serif;
    border-radius: 50px;
    border: 2px solid var(--navy);
    background: transparent;
    color: var(--navy);
    cursor: pointer;
    transition: all 0.15s;
    margin-left: 8px;
  }
  .nav-today-btn:hover { background: var(--navy); color: white; }
  .nav-today-btn.hidden { display: none; }
</style>
</head>
<body>
<div class="app">

  <div class="clock-bar">
    <div>
      <div class="clock-time" id="clock-time">12:00 PM</div>
      <div class="wifi-status">
        <div class="wifi-dot" id="wifi-dot"></div>
        <span id="wifi-label">Connected</span>
      </div>
    </div>
    <div class="clock-date">
      <span class="day-name" id="clock-dayname">Monday</span>
      <span id="clock-datestr">May 4, 2026</span>
    </div>
  </div>

  <div class="view-bar">
    <span class="view-label">Show:</span>
    <button class="view-btn active" id="btn-week" onclick="setView('week')">1 Week</button>
    <button class="view-btn" id="btn-twoweek" onclick="setView('twoweek')">2 Weeks</button>
    <button class="view-btn" id="btn-month" onclick="setView('month')">Month</button>
    <div class="legend" style="margin-left:auto;">
      <div class="legend-item"><div class="legend-dot" style="background:#2D6A4F"></div>Medical</div>
      <div class="legend-item"><div class="legend-dot" style="background:#7B2D8B"></div>Family</div>
      <div class="legend-item"><div class="legend-dot" style="background:#B45309"></div>Reminder</div>
      <div class="legend-item"><div class="legend-dot" style="background:#1E5F8C"></div>Routine</div>
    </div>
  </div>

  <div class="nav-strip">
    <button class="nav-btn" id="nav-prev" onclick="navigate(-1)">&#8592;</button>
    <div class="nav-label" id="nav-label"></div>
    <button class="nav-btn" id="nav-next" onclick="navigate(1)">&#8594;</button>
    <button class="nav-today-btn hidden" id="nav-today" onclick="goToday()">Back to Today</button>
  </div>

  <div class="cal-area" id="cal-area"></div>

</div>

<script>
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYS_S = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_S = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let allEvents = [];
let currentView = 'week';
let navOffset = 0; // weeks or months offset from today

function sameDay(a, b) {
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
}
function eventsFor(d) {
  return allEvents.filter(e => {
    const ed = new Date(e.date + 'T00:00:00');
    return sameDay(ed, d);
  }).sort((a,b) => (a.time||'').localeCompare(b.time||''));
}

function updateClock() {
  const now = new Date();
  let h = now.getHours(), m = now.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  document.getElementById('clock-time').textContent = h + ':' + String(m).padStart(2,'0') + ' ' + ampm;
  document.getElementById('clock-dayname').textContent = DAYS[now.getDay()];
  document.getElementById('clock-datestr').textContent = MONTHS[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
}

async function fetchEvents() {
  try {
    const r = await fetch('/api/events');
    allEvents = await r.json();
    document.getElementById('wifi-dot').className = 'wifi-dot';
    document.getElementById('wifi-label').textContent = 'Connected';
    render();
  } catch(e) {
    document.getElementById('wifi-dot').className = 'wifi-dot offline';
    document.getElementById('wifi-label').textContent = 'Offline — showing saved schedule';
  }
}

function navigate(dir) {
  navOffset += dir;
  render();
}

function goToday() {
  navOffset = 0;
  render();
}

function updateNavLabel() {
  const today = new Date();
  const todayBtn = document.getElementById('nav-today');
  todayBtn.classList.toggle('hidden', navOffset === 0);

  if (currentView === 'month') {
    const d = new Date(today.getFullYear(), today.getMonth() + navOffset, 1);
    document.getElementById('nav-label').textContent = MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  } else {
    const weeksToAdd = currentView === 'twoweek' ? navOffset * 2 : navOffset;
    const start = new Date(today);
    start.setDate(today.getDate() - today.getDay() + weeksToAdd * 7);
    const numWeeks = currentView === 'twoweek' ? 2 : 1;
    const end = new Date(start);
    end.setDate(start.getDate() + numWeeks * 7 - 1);

    const startStr = MONTHS_S[start.getMonth()] + ' ' + start.getDate();
    const endStr = (start.getMonth() !== end.getMonth() ? MONTHS_S[end.getMonth()] + ' ' : '') + end.getDate() + ', ' + end.getFullYear();
    document.getElementById('nav-label').textContent = startStr + ' – ' + endStr;
  }
}

function evPillHtml(e, size) {
  const cls = size === 'month' ? 'month-ev' : 'ev-pill';
  return `<div class="${cls} ${e.category||'routine'}">${size!=='month'?`<span class="ev-time">${e.time||''}</span>`:''}${e.title}</div>`;
}

function todayStripHtml() {
  const today = new Date();
  const evs = eventsFor(today);
  let pills = evs.length === 0
    ? '<span class="no-events-today">No appointments today</span>'
    : evs.map(e => `<span class="today-strip-pill ${e.category||'routine'}">${e.time ? e.time+' — ':''} ${e.title}</span>`).join('');
  return `<div class="today-strip"><span class="today-strip-label">Today</span><div class="today-strip-events">${pills}</div></div>`;
}

function renderWeek(numWeeks) {
  const today = new Date();
  const weeksToAdd = numWeeks === 2 ? navOffset * 2 : navOffset;
  const start = new Date(today);
  start.setDate(today.getDate() - today.getDay() + weeksToAdd * 7);

  let html = navOffset === 0 ? todayStripHtml() : '';
  html += '<div class="dow-row">' + DAYS_S.map(d=>`<div class="dow-hdr">${d}</div>`).join('') + '</div>';

  for (let w = 0; w < numWeeks; w++) {
    html += '<div class="week-row">';
    for (let d = 0; d < 7; d++) {
      const cur = new Date(start);
      cur.setDate(start.getDate() + w*7 + d);
      const isToday = sameDay(cur, today);
      const evs = eventsFor(cur);
      html += `<div class="week-cell${isToday?' is-today':''}">
        <div class="week-cell-head">
          <div class="week-cell-dow">${DAYS_S[cur.getDay()]}</div>
          <div class="week-cell-date">${cur.getDate()}</div>
        </div>
        <div class="week-cell-events">${evs.map(e=>evPillHtml(e,'week')).join('')}</div>
      </div>`;
    }
    html += '</div>';
  }
  return html;
}

function renderMonth() {
  const today = new Date();
  const year = new Date(today.getFullYear(), today.getMonth() + navOffset, 1).getFullYear();
  const month = new Date(today.getFullYear(), today.getMonth() + navOffset, 1).getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrev = new Date(year, month, 0).getDate();

  let html = navOffset === 0 ? todayStripHtml() : '';
  html += '<div class="dow-row">' + DAYS_S.map(d=>`<div class="dow-hdr">${d}</div>`).join('') + '</div>';
  html += '<div class="month-grid">';

  const totalCells = Math.ceil((firstDay + daysInMonth) / 7) * 7;
  let dayCount = 1, nextCount = 1;
  for (let i = 0; i < totalCells; i++) {
    let cellDate, other = false;
    if (i < firstDay) { cellDate = new Date(year, month-1, daysInPrev-firstDay+1+i); other=true; }
    else if (dayCount > daysInMonth) { cellDate = new Date(year, month+1, nextCount++); other=true; }
    else { cellDate = new Date(year, month, dayCount++); }
    const isToday = sameDay(cellDate, today);
    const evs = eventsFor(cellDate);
    html += `<div class="month-cell${other?' other-month':''}${isToday?' is-today':''}">
      <div class="month-cell-date">${cellDate.getDate()}</div>
      ${evs.slice(0,3).map(e=>evPillHtml(e,'month')).join('')}
      ${evs.length>3?`<div style="font-size:10px;color:var(--muted)">+${evs.length-3} more</div>`:''}
    </div>`;
  }
  html += '</div>';
  return html;
}

function render() {
  updateNavLabel();
  const area = document.getElementById('cal-area');
  if (currentView === 'week') area.innerHTML = renderWeek(1);
  else if (currentView === 'twoweek') area.innerHTML = renderWeek(2);
  else area.innerHTML = renderMonth();
}

function setView(v) {
  currentView = v;
  navOffset = 0;
  ['week','twoweek','month'].forEach(name => {
    document.getElementById('btn-'+name).classList.toggle('active', name===v);
  });
  render();
}

updateClock();
setInterval(updateClock, 10000);
fetchEvents();
setInterval(fetchEvents, 30000);
</script>
</body>
</html>
